<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>P2C 提出状況</title>
  <style>
    :root { color-scheme:light; --ink:#16241e; --line:#cbd7cf; --green:#16734d; --yellow:#ffe64e; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f6faf7; color:var(--ink); font-family:"Yu Gothic", Meiryo, sans-serif; }
    header,.bar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 5%; background:#fff; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:22px; }
    .bar { background:#e7f2eb; font-size:13px; }
    button { border:0; border-radius:4px; background:var(--green); color:#fff; padding:8px 10px; font-weight:bold; cursor:pointer; }
    button:disabled { cursor:not-allowed; opacity:.55; }
    .settings { max-width:1350px; margin:12px auto; padding:14px; background:#fff; border:1px solid var(--line); }
    .settings p { margin:0 0 10px; font-size:13px; }
    .nums button { min-width:31px; margin:2px; background:#edf2ee; color:#234; }
    .nums .off { background:#7b8580; color:#fff; }
    main { overflow:auto; }
    .board { display:grid; grid-template-columns:max-content max-content max-content; gap:0 36px; width:max-content; min-width:1120px; margin:26px auto; }
    .block { display:grid; grid-template-columns:repeat(3,112px); }
    .block.mid { grid-template-columns:repeat(4,112px); }
    .seat { display:flex; flex-direction:column; min-height:142px; gap:7px; padding:7px; text-align:center; border:1px solid #9aa59e; background:#fff; }
    .seat > b { margin:-7px -7px 0; padding:6px; background:var(--yellow); font-size:19px; }
    .seat small { color:#52695d; }
    .seat.stage-0 { background:#ef5350; }
    .seat.stage-1 { background:#ffe66d; }
    .seat.stage-2 { background:#4d96e8; }
    .seat.stage-3 { background:#63bd78; }
    .seat.stage-0 small,.seat.stage-2 small,.seat.stage-3 small { color:#fff; }
    .seat.stage-0 .seat-status,.seat.stage-2 .seat-status,.seat.stage-3 .seat-status { border-color:rgba(255,255,255,.65); }
    .seat.stage-0 .seat-status strong,.seat.stage-2 .seat-status strong,.seat.stage-3 .seat-status strong { color:#fff; }
    .seat.stage-0 .seat-status .done,.seat.stage-2 .seat-status .done,.seat.stage-3 .seat-status .done { color:#fff; }
    .seat.absent { background:#aeb6b1; }
    .seat.absent > b { background:#7b8580; color:#fff; }
    .seat.mine { box-shadow:inset 0 0 0 3px #238d5e; }
    .seat-status { margin-top:auto; padding-top:6px; border-top:1px solid #a9b8af; font-size:13px; line-height:1.55; }
    .seat-status strong { display:block; font-size:14px; color:#075f40; }
    .seat-status .done { color:#52695d; text-decoration:line-through; }
    .seat-actions { margin-top:3px; }
    .note { max-width:1350px; margin:10px auto; padding:0 14px; color:#52695d; font-size:12px; }
    .modal { position:fixed; z-index:10; inset:0; display:grid; place-items:center; padding:18px; background:rgba(15,35,26,.52); }
    .modal[hidden] { display:none; }
    .modal-card { width:min(390px,100%); padding:24px; background:#fff; border:1px solid var(--line); border-radius:6px; box-shadow:0 12px 32px rgba(0,0,0,.22); }
    .modal-card h2 { margin:0 0 8px; font-size:20px; }
    .modal-card p { margin:0 0 16px; color:#52695d; font-size:13px; }
    .modal-row { display:flex; gap:8px; }
    .modal-row input { flex:1; width:auto; padding:8px; border:1px solid #9aa59e; border-radius:4px; }
    @media (max-width:700px) { header,.bar { flex-direction:column; align-items:flex-start; } .board { margin-left:15px; } }
  </style>
</head>
<body>
  <header><h1>P2C 提出状況</h1><button id="openLogin">ログイン</button></header>
  <div class="bar"><b id="message">出席番号でログインしてください</b><span>操作は数秒以内に全員へ反映されます</span></div>
  <section id="admin"></section>
  <p class="note">自分の座席だけで提出状況を操作できます。提出した課題は「提出済」として全員の画面に表示されます。</p>
  <main><div class="board" id="board"></div></main>
  <div class="modal" id="loginModal" role="dialog" aria-modal="true" aria-labelledby="loginTitle"><div class="modal-card"><h2 id="loginTitle">ログイン</h2><p>出席番号を入力してください。</p><div class="modal-row"><input id="attendanceNo" inputmode="numeric" placeholder="出席番号" aria-label="出席番号"><button id="loginButton">ログイン</button></div></div></div>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzRcQOHhm-Ug4bRnabw4rWoxFSTp9Lt2lhy2iT4fXcYWYKTQVZGYSpCpTURQCR2u3xV5Q/exec";
    const BLOCKS = [[12,8,2],[36,17,23],[10,14,6],[5,37,7],[39,29,28,9],[1,20,13,16],[30,18,21,15],[11,40,3,22],[33,24,19],[4,26,27],[25,31,35],[32,38,34]];
    const TASKS = ["pair06-1", "pair06-2", "portfolio04"];
    let state;
    let userNo = null;
    let actionPending = false;
    let stateEpoch = 0;

    const message = (text) => { document.querySelector("#message").textContent = text; };
    const configured = () => API_URL !== "PASTE_APPS_SCRIPT_WEB_APP_URL";
    const progressFor = (no) => Math.max(0, Math.min(TASKS.length, Number(state.submissions[no]) || 0));
    function normalizeState(rawState) { return { ...rawState, absent:Array.isArray(rawState.absent) ? rawState.absent : [], submissions:{ ...(rawState.submissions || {}) } }; }

    async function load() {
      if (!configured() || actionPending) return;
      const requestEpoch = stateEpoch;
      try {
        const response = await fetch(`${API_URL}?action=get&t=${Date.now()}`, { cache:"no-store" });
        const data = await response.json();
        if (actionPending || requestEpoch !== stateEpoch) return;
        state = normalizeState(data.state);
        draw();
      } catch (_) { message("データに接続できません。先生に知らせてください。"); }
    }

    async function save(nextState) {
      if (actionPending) return;
      actionPending = true;
      stateEpoch += 1;
      draw();
      try {
        const params = new URLSearchParams({ action:"save", revision:String(state.revision), state:JSON.stringify(nextState), t:String(Date.now()) });
        const response = await fetch(`${API_URL}?${params.toString()}`, { cache:"no-store" });
        const data = await response.json();
        state = normalizeState(data.state);
        if (!response.ok || data.error) message("他の操作が先に反映されました。画面を確認して、もう一度操作してください。");
      } catch (_) { message("保存できませんでした。少し待ってから、もう一度操作してください。"); }
      finally { actionPending = false; draw(); }
    }

    function login() {
      const no = Number(document.querySelector("#attendanceNo").value);
      if (!state) return message("データを読み込み中です。少し待ってからログインしてください。");
      if (!Number.isInteger(no) || (!(no >= 1 && no <= 40) && no !== 99)) return message("1〜40、管理者は99を入力してください");
      if (no !== 99 && state.absent.includes(no)) return message("この番号は欠席に設定されているためログインできません");
      userNo = no;
      document.querySelector("#loginModal").hidden = true;
      message(no === 99 ? "管理者としてログインしました" : `${no}番でログインしました。自分の座席から提出を記録できます。`);
      draw();
    }

    function submitCurrentTask(no) {
      if (no !== userNo || userNo === 99 || state.absent.includes(no) || progressFor(no) >= TASKS.length) return;
      const currentTask = TASKS[progressFor(no)];
      const next = structuredClone(state);
      next.submissions[no] = progressFor(no) + 1;
      message(`${currentTask} を提出済みにしました。`);
      save(next);
    }

    function taskStatus(no) {
      const completed = progressFor(no);
      const lines = TASKS.map((task, index) => index < completed ? `<span class="done">【提出済】${task}</span>` : index === completed ? `<strong>【作成中】${task}</strong>` : "");
      return lines.filter(Boolean).join("<br>") || "<strong>Free!</strong>";
    }

    function draw() {
      if (!state) return;
      const board = document.querySelector("#board");
      board.innerHTML = "";
      BLOCKS.forEach((block, index) => {
        const blockElement = document.createElement("div");
        blockElement.className = `block ${block.length === 4 ? "mid" : ""}`;
        blockElement.style.gridColumn = index < 4 ? 1 : index < 8 ? 2 : 3;
        blockElement.style.gridRow = (index % 4) + 1;
        block.forEach((no) => {
          const absent = state.absent.includes(no);
          const mine = userNo === no;
          const seat = document.createElement("div");
          seat.className = `seat ${absent ? "absent" : `stage-${progressFor(no)}`} ${mine ? "mine" : ""}`;
          seat.innerHTML = `<b>${no}</b><small>${absent ? "欠席" : "提出状況"}</small>`;
          if (!absent) seat.insertAdjacentHTML("beforeend", `<div class="seat-status">${taskStatus(no)}</div>`);
          if (mine && !absent && progressFor(no) < TASKS.length) seat.insertAdjacentHTML("beforeend", `<div class="seat-actions"><button data-action="submit"${actionPending ? " disabled" : ""}>${TASKS[progressFor(no)]} を提出</button></div>`);
          seat.querySelector('[data-action="submit"]')?.addEventListener("click", () => submitCurrentTask(no));
          blockElement.appendChild(seat);
        });
        board.appendChild(blockElement);
      });
      drawAdmin();
    }

    function drawAdmin() {
      const admin = document.querySelector("#admin");
      if (userNo !== 99) { admin.innerHTML = ""; return; }
      admin.innerHTML = `<div class="settings"><p><b>欠席者設定</b>：番号をクリックすると、欠席・出席を切り替えます。</p><div class="nums">${Array.from({ length:40 }, (_, index) => `<button class="${state.absent.includes(index + 1) ? "off" : ""}" data-no="${index + 1}">${index + 1}</button>`).join("")}</div></div>`;
      admin.querySelectorAll("[data-no]").forEach((button) => button.addEventListener("click", () => {
        const no = Number(button.dataset.no);
        const next = structuredClone(state);
        next.absent = next.absent.includes(no) ? next.absent.filter((item) => item !== no) : [...next.absent, no];
        save(next);
      }));
    }

    document.querySelector("#openLogin").addEventListener("click", () => { document.querySelector("#loginModal").hidden = false; document.querySelector("#attendanceNo").focus(); });
    document.querySelector("#loginButton").addEventListener("click", login);
    document.querySelector("#attendanceNo").addEventListener("keydown", (event) => { if (event.key === "Enter") login(); });
    if (configured()) { load(); setInterval(load, 3500); } else { message("先生の初期設定がまだ完了していません"); }
  </script>
</body>
</html>
